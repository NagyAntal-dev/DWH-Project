##############################################################
# Crypto Data Warehouse — Docker Compose
##############################################################

services:

  # ── OLTP PostgreSQL (raw CoinGecko data + Airflow metadata) ──
  oltp-db:
    image: postgres:16-alpine
    container_name: crypto-oltp-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${OLTP_DB_USER}
      POSTGRES_PASSWORD: ${OLTP_DB_PASSWORD}
      POSTGRES_DB: ${OLTP_DB_NAME}
    ports:
      - "5435:5432"
    volumes:
      - oltp-data:/var/lib/postgresql/data
      - ./init-scripts/oltp:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${OLTP_DB_USER} -d ${OLTP_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── DW PostgreSQL (star schema) ──
  dw-db:
    image: postgres:16-alpine
    container_name: crypto-dw-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DW_DB_USER}
      POSTGRES_PASSWORD: ${DW_DB_PASSWORD}
      POSTGRES_DB: ${DW_DB_NAME}
    ports:
      - "5436:5432"
    volumes:
      - dw-data:/var/lib/postgresql/data
      - ./init-scripts/dw:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DW_DB_USER} -d ${DW_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis (Airflow support) ──
  redis:
    image: redis:7-alpine
    container_name: crypto-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Airflow Init (DB migration + admin user creation) ──
  airflow-init:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crypto-airflow-init
    env_file: .env
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate &&
        airflow users create \
          --username "$${AIRFLOW_ADMIN_USER}" \
          --password "$${AIRFLOW_ADMIN_PASSWORD}" \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email "$${AIRFLOW_ADMIN_EMAIL}" || true &&
        echo 'Airflow init complete'
    depends_on:
      oltp-db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Airflow Webserver ──
  airflow-webserver:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crypto-airflow-webserver
    restart: unless-stopped
    env_file: .env
    command: airflow webserver
    ports:
      - "8080:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - airflow-logs:/opt/airflow/logs
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── Airflow Scheduler (also runs dbt) ──
  airflow-scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crypto-airflow-scheduler
    restart: unless-stopped
    env_file: .env
    command: airflow scheduler
    volumes:
      - ./dags:/opt/airflow/dags
      - ./dbt:/opt/dbt
      - airflow-logs:/opt/airflow/logs
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      oltp-db:
        condition: service_healthy
      dw-db:
        condition: service_healthy

  # ── Metabase (BI / Dashboards) ──
  metabase:
    image: metabase/metabase:latest
    container_name: crypto-metabase
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      MB_DB_TYPE: h2
    volumes:
      - metabase-data:/metabase-data
    depends_on:
      dw-db:
        condition: service_healthy

volumes:
  oltp-data:
  dw-data:
  airflow-logs:
  metabase-data:
